name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Check public source files
        shell: pwsh
        run: python scripts/check-public-source.py
      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Test -Publish
      - name: Audit application package
        shell: pwsh
        run: ./scripts/audit-release.ps1 -PackageDirectory outputs/ArmoredCoreHub
      - name: Upload application files
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armored-core-hub-win-x64-${{ github.sha }}
          path: outputs/ArmoredCoreHub/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test report separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.sha }}
          path: work/test-results/test-results.json
          if-no-files-found: ignore
          retention-days: 7
